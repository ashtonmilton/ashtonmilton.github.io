name = "ashtonmilton-localisation"
main = "about-localisation.mjs"
compatibility_date = "2026-11-27"
workers_dev = false
preview_urls = false

[vars]
ABOUT_LOCALISATION = "on"
SECURITY_HEADERS = "on"
READERSHIP_ENABLED = "off"

[[analytics_engine_datasets]]
binding = "READERSHIP_EVENTS"
dataset = "ashton_readership"

[[ratelimits]]
name = "READERSHIP_LIMIT"
namespace_id = "811018"

[ratelimits.simple]
limit = 60
period = 60
